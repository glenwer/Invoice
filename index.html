<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glenview Florist - Invoice System</title>
<style>
  :root {
    --bg: #f6faea; --card: #ffffff; --text: #26301a; --muted: #6d7a58; --line: #dfeac2;
    --brand: #a6d84a; --brand-dark: #8bc232; --brand-text: #22330a; --tint: #eef7d3; --danger: #c0262d;
    --warn-bg: #fff4d6; --warn: #8a5a00; --ok-bg: #eaf6cc; --ok: #3d5a0a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151a0f; --card: #1f2616; --text: #eef3e0; --muted: #aab796; --line: #343f24;
            --brand: #b5e05a; --brand-dark: #a0cc42; --brand-text: #1c2a07; --tint: #2a331b; --danger: #ff8a8f;
            --warn-bg: #3a3017; --warn: #f4c95d; --ok-bg: #2a331b; --ok: #cfe99a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
         background: var(--bg); color: var(--text); font-size: 14px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 10px 12px; }
  .topbar { display: flex; align-items: center; gap: 10px; background: var(--tint); border: 1px solid var(--line);
            border-radius: 10px; padding: 6px 12px; margin-bottom: 10px; }
  .topbar img { height: 40px; width: auto; flex: none; }
  .topbar .title { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; }
  .btn { background: var(--brand); color: var(--brand-text); border: 0; border-radius: 8px; padding: 9px 14px; font-size: 14px;
         font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--brand-dark); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .btn.ghost:hover { background: var(--tint); }
  .btn.block { width: 100%; margin-top: 10px; padding: 11px; font-size: 15px; }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 10px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .card h2 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  input, select { width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: var(--card); color: var(--text); }
  input:focus, select:focus { outline: 2px solid var(--brand-dark); border-color: transparent; }
  input[readonly] { background: var(--tint); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .total-preview { text-align: right; font-weight: 700; margin-top: 6px; }
  .meta { color: var(--muted); font-size: 12px; }
  .msg { padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; display: none; }
  .msg.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  .msg.err { display: block; background: #fde8e6; color: var(--danger); }
  .warn { background: var(--warn-bg); color: var(--warn); padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; }
  .billbox { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.45; background: var(--tint); }
  .billbox b { font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 5px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 700; font-size: 11px; position: sticky; top: 0; background: var(--card); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.act { white-space: nowrap; text-align: right; }
  td.act button { background: none; border: 0; color: var(--brand-dark); cursor: pointer; font-size: 12px; padding: 3px; font-weight: 700; }
  td.act button.del { color: var(--danger); }
  .tablewrap { overflow: auto; max-height: 36vh; }
  .totalbar { display: flex; justify-content: space-between; font-weight: 800; padding: 8px 5px 0; font-size: 15px; }
  .hidden { display: none !important; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 14px; width: min(460px, 94vw); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.35); }

  /* ---------- Invoice output overlay ---------- */
  #outOverlay { position: fixed; inset: 0; background: rgba(30,40,15,.55); z-index: 50; overflow: auto; padding: 14px; }
  .outbar { max-width: 820px; margin: 0 auto 10px; display: flex; gap: 8px; justify-content: flex-end; }
  #paper { background: #fff; color: #111; max-width: 820px; margin: 0 auto; padding: 28px 32px; border-radius: 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; }
  #paper .head { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: start; gap: 16px; }
  #paper .head > .logo { grid-column: 1; grid-row: 1; }
  #paper .co { grid-column: 1; grid-row: 2; line-height: 1.5; }
  #paper .billto { grid-column: 2; grid-row: 2; }
  #paper .inv { grid-column: 3; grid-row: 1 / span 2; }
  #paper .co { line-height: 1.5; }
  #paper .plogo { display: block; width: 170px; height: auto; margin: -9px 0 2px -4px; }   /* ~1.5x the width of the "Glenview Florist" name */
  #paper .shop { font-size: 15px; font-weight: 700; }
  #paper .inv { text-align: right; }
  #paper .inv h1 { margin: 0; font-size: 30px; line-height: 1.1; }
  #paper .invno { font-size: 22px; font-weight: 700; margin-top: 2px; }
  #paper .dates { margin: 10px 0 0 auto; font-size: 13px; border-collapse: collapse; }
  #paper .dates td { border: 0; padding: 2px 0; }
  #paper .dates td.k { color: #555; text-align: left; padding-right: 16px; white-space: nowrap; }
  #paper .dates td.v { text-align: right; min-width: 78px; font-weight: 600; }
  #paper .billto { text-align: center; line-height: 1.5; }
  #paper table { margin-top: 14px; font-size: 12.5px; }
  #paper th { background: #eef7d3; color: #222; border: 1px solid #c9d9a0; position: static; text-align: center; font-size: 12px; padding: 5px; }
  #paper td { border: 1px solid #d8e2bd; padding: 5px; }
  #paper .sum { margin-top: 12px; display: flex; justify-content: space-between; align-items: flex-end; }
  #paper .sum table { width: 260px; margin: 0; }
  #paper .sum td { border: 0; border-bottom: 1px solid #ddd; }
  @media print {
    body { background: #fff; }
    #app, dialog { display: none !important; }
    #outOverlay { position: static; background: #fff; padding: 0; overflow: visible; }
    .outbar { display: none; }
    #paper { box-shadow: none; max-width: none; padding: 0; }
    @page { margin: 14mm; }
  }
</style>
</head>
<body>

<div id="app" class="wrap">
  <div class="topbar">
    <img src="logo.png" alt="Glenview Florist">
    <div class="title">Glenview Florist - Invoice System</div>
    <button class="btn" id="outTopBtn" type="button">Invoice Output</button>
    <button class="btn ghost" id="refreshBtn" type="button">Refresh Data</button>
  </div>

  <div id="msg" class="msg"></div>

  <div class="grid">
    <!-- LEFT: account + order entry -->
    <div>
      <div class="card">
        <h2>Account</h2>
        <div class="row">
          <div>
            <label for="account">Account</label>
            <select id="account"></select>
          </div>
          <div>
            <label for="month">Invoice Month</label>
            <input id="month" type="month">
          </div>
        </div>
        <div class="meta" id="acctMeta" style="margin-top:6px"></div>
      </div>

      <div class="card">
        <h2 id="formTitle">Order Entry</h2>
        <div class="row">
          <div>
            <label for="orderDate">Order Date</label>
            <input id="orderDate" type="date">
          </div>
          <div>
            <label for="deliveryDate">Delivery Date</label>
            <input id="deliveryDate" type="date">
          </div>
        </div>
        <label for="nameTown">Name &amp; Town</label>
        <input id="nameTown" type="text" placeholder="e.g. Eppie Bacalla, Skokie IL" autocomplete="off">
        <div class="row">
          <div>
            <label for="qty">Qty</label>
            <input id="qty" type="number" inputmode="numeric" min="1" step="1" value="1">
          </div>
          <div>
            <label for="unitPrice">Unit Price ($)</label>
            <input id="unitPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
          </div>
        </div>
        <div class="total-preview">Total: <span id="totalPreview">$0.00</span></div>
        <button class="btn block" id="saveBtn" type="button">Add Order</button>
        <button class="btn ghost block hidden" id="cancelEditBtn" type="button" style="margin-top:6px">Cancel Edit</button>
      </div>
    </div>

    <!-- RIGHT: invoice info + entries -->
    <div>
      <div class="card">
        <h2>Invoice</h2>
        <div class="row">
          <div>
            <label for="invDate">Invoice Date</label>
            <input id="invDate" type="text" readonly>
          </div>
          <div>
            <label for="dueDate">Due Date</label>
            <input id="dueDate" type="text" readonly>
          </div>
        </div>
        <div class="row" style="margin-top:6px">
          <div>
            <label>Bill To</label>
            <div class="billbox" id="billBox"></div>
            <button class="btn ghost sm" id="billEditBtn" type="button" style="margin-top:6px">Edit Bill To</button>
          </div>
          <div>
            <label for="paidDate">Paid Date</label>
            <input id="paidDate" type="date">
            <button class="btn sm" id="paidBtn" type="button" style="margin-top:6px">Save Paid Date</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 id="listTitle">Orders</h2>
        <div id="unassignedBox"></div>
        <div class="tablewrap">
          <table>
            <thead>
              <tr><th>Order</th><th>Delivery</th><th>Name &amp; Town</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="totalbar"><span>Invoice Total</span><span id="grandTotal">$0.00</span></div>
        <div class="meta" id="capacityMeta" style="margin-top:4px"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="outBtn" type="button">Invoice Output</button>
          <button class="btn ghost" id="syncBtn" type="button">Sync Output Sheet Month</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bill To editor -->
<dialog id="billDlg">
  <h2 style="margin:0 0 6px;font-size:16px">Edit Bill To</h2>
  <label for="bt1">Bill To 1 (facility name)</label><input id="bt1" type="text">
  <label for="bt2">Bill To 2 (optional)</label><input id="bt2" type="text">
  <label for="btAttn">Attn</label><input id="btAttn" type="text">
  <label for="btAddr">Address</label><input id="btAddr" type="text">
  <div class="row">
    <div><label for="btPhone">Phone / extra</label><input id="btPhone" type="text"></div>
    <div><label for="btEmail">Email</label><input id="btEmail" type="text"></div>
  </div>
  <label for="btCity">City, State Zip</label><input id="btCity" type="text">
  <div class="row" style="margin-top:12px">
    <button class="btn" id="billSaveBtn" type="button">Save</button>
    <button class="btn ghost" id="billCancelBtn" type="button">Cancel</button>
  </div>
  <div class="meta" style="margin-top:6px">Saved to the Accounts tab and this account's output invoice sheet.</div>
</dialog>

<!-- Invoice output -->
<div id="outOverlay" class="hidden">
  <div class="outbar">
    <button class="btn" id="printBtn" type="button">Print / Save PDF</button>
    <button class="btn ghost" id="closeOutBtn" type="button">Close</button>
  </div>
  <div id="paper"></div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzEQuHS30yoDyBrwAqYvNgqf4Wr6wlZbmiKGsyzaRfjZQBy2zF9kKlC3yv0LiOUPWwE/exec';

const $ = (id) => document.getElementById(id);
let accounts = [];
let lastData = { rows: [], unassigned: [], used: 0, capacity: 100, paidDate: '' };
let editingRow = null;
let dirtyDelivery = false;

const money = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad = (n) => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const monthStr = () => todayStr().slice(0, 7);
const mdy = (d) => pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + '/' + d.getFullYear();
const isoToMdyFull = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[2] + '/' + m[3] + '/' + m[1] : ''; };
const isoToMdy = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[2] + '/' + m[3] + '/' + m[1].slice(2) : ''; };
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function showMsg(text, ok) {
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  if (ok) setTimeout(() => { if (el.textContent === text) el.className = 'msg'; }, 3500);
}

async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // avoids CORS preflight
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ---------- App ----------
function fillAccountSelect(keep) {
  const sel = $('account');
  sel.innerHTML = '';
  accounts.forEach((a) => {
    const o = document.createElement('option');
    o.value = a.key; o.textContent = a.name;
    sel.appendChild(o);
  });
  if (keep && accounts.some((a) => a.key === keep)) sel.value = keep;
}

function initApp() {
  fillAccountSelect(localStorage.getItem('invoiceAccount'));
  $('month').value = monthStr();
  resetForm();
  renderBill();
  refresh();
}

function currentAccount() { return accounts.find((a) => a.key === $('account').value); }

function renderBill() {
  const a = currentAccount();
  if (!a) return;
  $('billBox').innerHTML =
    '<b>' + esc(a.bill1) + '</b>' + (a.bill2 ? ' ' + esc(a.bill2) : '') + '<br>' +
    (a.attn ? 'Attn : ' + esc(a.attn) + '<br>' : '') +
    esc(a.addr) + (a.phone ? ' &nbsp;' + esc(a.phone) : '') + '<br>' +
    esc(a.city) + (a.email ? ' &nbsp;' + esc(a.email) : '');
}

function invoiceDates() {
  const m = $('month').value;
  if (!/^\d{4}-\d{2}$/.test(m)) return null;
  const y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7));
  const inv = new Date(y, mo, 0);
  const due = new Date(inv.getFullYear(), inv.getMonth(), inv.getDate() + 15);
  return { inv: mdy(inv), due: mdy(due) };
}

function updateInvoiceDates() {
  const d = invoiceDates();
  $('invDate').value = d ? d.inv : '';
  $('dueDate').value = d ? d.due : '';
}

function resetForm() {
  editingRow = null; dirtyDelivery = false;
  $('formTitle').textContent = 'Order Entry';
  $('saveBtn').textContent = 'Add Order';
  $('cancelEditBtn').classList.add('hidden');
  $('orderDate').value = todayStr();
  $('deliveryDate').value = todayStr();
  $('nameTown').value = '';
  $('qty').value = 1;
  $('unitPrice').value = '';
  updatePreview();
}

function updatePreview() {
  $('totalPreview').textContent = money(Number($('qty').value || 0) * Number($('unitPrice').value || 0));
}

['qty', 'unitPrice'].forEach((id) => $(id).addEventListener('input', updatePreview));
$('orderDate').addEventListener('change', () => { if (!dirtyDelivery) $('deliveryDate').value = $('orderDate').value; });
$('deliveryDate').addEventListener('change', () => { dirtyDelivery = true; });
$('account').addEventListener('change', () => {
  localStorage.setItem('invoiceAccount', $('account').value);
  resetForm(); renderBill(); refresh();
});
$('month').addEventListener('change', refresh);
$('cancelEditBtn').onclick = resetForm;

$('refreshBtn').onclick = async () => {
  const btn = $('refreshBtn');
  btn.disabled = true;
  try {
    const keep = $('account').value;
    accounts = (await api({ action: 'accounts' })).accounts;
    fillAccountSelect(keep);
    renderBill();
    await refresh();
    showMsg('Data refreshed.', true);
  } catch (e) { showMsg(e.message, false); }
  btn.disabled = false;
};

async function refresh() {
  const acct = currentAccount();
  if (!acct) return;
  $('acctMeta').textContent = 'Next invoice no.: ' + acct.nextInvoice;
  $('listTitle').textContent = 'Orders - ' + ($('month').value || 'All');
  updateInvoiceDates();
  try {
    const data = await api({ action: 'list', account: acct.key, month: $('month').value });
    lastData = data;
    $('paidDate').value = data.paidDate || '';
    renderRows(data);
  } catch (e) { showMsg(e.message, false); }
}

function sortedRows(data) {
  return data.rows.slice().sort((a, b) => (a.deliveryDate + a.row).localeCompare(b.deliveryDate + b.row));
}

function renderRows(data) {
  const rows = sortedRows(data);
  let total = 0;
  $('rows').innerHTML = rows.map((r) => {
    total += Number(r.total || 0);
    return '<tr>' +
      '<td>' + esc(r.orderDate.slice(5)) + '</td>' +
      '<td>' + esc(r.deliveryDate.slice(5)) + '</td>' +
      '<td>' + esc(r.nameTown) + '</td>' +
      '<td class="num">' + esc(r.qty) + '</td>' +
      '<td class="num">' + money(r.unitPrice) + '</td>' +
      '<td class="num">' + money(r.total) + '</td>' +
      '<td class="act"><button data-edit="' + r.row + '">Edit</button><button class="del" data-del="' + r.row + '">Delete</button></td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="7" class="meta">No orders for this month.</td></tr>';
  $('grandTotal').textContent = money(total);
  $('capacityMeta').textContent = 'Sheet usage: ' + data.used + ' / ' + data.capacity + ' rows (all months)';

  $('unassignedBox').innerHTML = data.unassigned.length
    ? '<div class="warn">' + data.unassigned.length + ' row(s) have no Delivery Date and are not included in any invoice month: ' +
      data.unassigned.map((r) => esc(r.nameTown || '(no name)') + ' [row ' + r.row + ']').join(', ') + '</div>'
    : '';

  const byRow = {};
  rows.forEach((r) => { byRow[r.row] = r; });
  document.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => startEdit(byRow[b.dataset.edit]));
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => removeRow(byRow[b.dataset.del]));
}

function startEdit(r) {
  editingRow = r.row; dirtyDelivery = true;
  $('formTitle').textContent = 'Edit Order (row ' + r.row + ')';
  $('saveBtn').textContent = 'Save Changes';
  $('cancelEditBtn').classList.remove('hidden');
  $('orderDate').value = r.orderDate;
  $('deliveryDate').value = r.deliveryDate;
  $('nameTown').value = r.nameTown;
  $('qty').value = r.qty;
  $('unitPrice').value = r.unitPrice;
  updatePreview();
  $('formTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function removeRow(r) {
  if (!confirm('Delete this order?\n' + r.deliveryDate + '  ' + r.nameTown + '  ' + money(r.total))) return;
  try {
    await api({ action: 'delete', account: currentAccount().key, row: r.row });
    showMsg('Deleted.', true);
    if (editingRow === r.row) resetForm();
    refresh();
  } catch (e) { showMsg(e.message, false); }
}

$('saveBtn').onclick = async () => {
  const btn = $('saveBtn');
  const payload = {
    action: editingRow ? 'update' : 'add',
    account: currentAccount().key,
    row: editingRow,
    orderDate: $('orderDate').value,
    deliveryDate: $('deliveryDate').value,
    nameTown: $('nameTown').value,
    qty: $('qty').value,
    unitPrice: $('unitPrice').value
  };
  btn.disabled = true;
  try {
    await api(payload);
    const wasEdit = !!editingRow;
    const keepOrder = $('orderDate').value, keepDelivery = $('deliveryDate').value;
    showMsg(wasEdit ? 'Order updated.' : 'Order added.', true);
    if (keepDelivery) $('month').value = keepDelivery.slice(0, 7);
    resetForm();
    if (!wasEdit) { $('orderDate').value = keepOrder; $('deliveryDate').value = keepDelivery; dirtyDelivery = true; }
    refresh();
    if (!wasEdit) $('nameTown').focus();
  } catch (e) { showMsg(e.message, false); }
  btn.disabled = false;
};

// ---------- Paid Date / sheet month / Bill To ----------
$('paidBtn').onclick = async () => {
  const btn = $('paidBtn');
  btn.disabled = true;
  try {
    await api({ action: 'savePaid', account: currentAccount().key, month: $('month').value, paidDate: $('paidDate').value });
    lastData.paidDate = $('paidDate').value;
    showMsg($('paidDate').value ? 'Paid Date saved.' : 'Paid Date cleared.', true);
  } catch (e) { showMsg(e.message, false); }
  btn.disabled = false;
};

$('syncBtn').onclick = async () => {
  const btn = $('syncBtn');
  btn.disabled = true;
  try {
    await api({ action: 'setOutputMonth', account: currentAccount().key, month: $('month').value });
    showMsg('Output sheet month set to ' + $('month').value + '.', true);
  } catch (e) { showMsg(e.message, false); }
  btn.disabled = false;
};

$('billEditBtn').onclick = () => {
  const a = currentAccount();
  $('bt1').value = a.bill1; $('bt2').value = a.bill2; $('btAttn').value = a.attn;
  $('btAddr').value = a.addr; $('btPhone').value = a.phone; $('btCity').value = a.city; $('btEmail').value = a.email;
  $('billDlg').showModal();
};
$('billCancelBtn').onclick = () => $('billDlg').close();
$('billSaveBtn').onclick = async () => {
  const btn = $('billSaveBtn');
  const a = currentAccount();
  const f = { bill1: $('bt1').value, bill2: $('bt2').value, attn: $('btAttn').value, addr: $('btAddr').value,
              phone: $('btPhone').value, city: $('btCity').value, email: $('btEmail').value };
  btn.disabled = true;
  try {
    await api(Object.assign({ action: 'saveBillTo', account: a.key }, f));
    Object.keys(f).forEach((k) => { a[k] = f[k].trim(); });
    a.name = a.bill1 + (a.bill2 ? ' / ' + a.bill2 : '');
    fillAccountSelect(a.key);
    renderBill();
    $('billDlg').close();
    showMsg('Bill To saved.', true);
  } catch (e) { showMsg(e.message, false); }
  btn.disabled = false;
};

// ---------- Invoice output (same layout as the Mary Weeks sample) ----------
function openOutput() {
  const a = currentAccount();
  const d = invoiceDates();
  if (!a || !d) { showMsg('Select an account and invoice month first.', false); return; }
  const rows = sortedRows(lastData);
  let total = 0;
  const body = rows.map((r, i) => {
    total += Number(r.total || 0);
    return '<tr><td style="text-align:center">' + (i + 1) + '</td><td>' + esc(isoToMdy(r.orderDate)) + '</td><td>' + esc(isoToMdy(r.deliveryDate)) +
      '</td><td>' + esc(r.nameTown) + '</td><td style="text-align:center">' + esc(r.qty) + '</td><td style="text-align:right">' + money(r.unitPrice) +
      '</td><td style="text-align:right">' + money(r.total) + '</td><td></td><td></td></tr>';
  }).join('') || '<tr><td colspan="9" style="text-align:center;color:#888">No orders for this month.</td></tr>';
  const paid = $('paidDate').value;
  const balance = paid ? 0 : total;

  $('paper').innerHTML =
    '<div class="head">' +
      '<div class="logo"><img class="plogo" src="logo.png" alt="Glenview Florist"></div>' +
      '<div class="co"><div class="shop">Glenview Florist</div>' +
        '1813 Waukegan Road<br>Glenview,IL 60025<br>(847)998-0717<br>glenviewflorist1@gmail.com</div>' +
      '<div class="billto"><b>Bill To</b><br><b>' + esc(a.bill1) + '</b>' + (a.bill2 ? ' ' + esc(a.bill2) : '') + '<br>' +
        (a.attn ? 'Attn : ' + esc(a.attn) + '<br>' : '') +
        (a.addr ? esc(a.addr) + '<br>' : '') + (a.city ? esc(a.city) + '<br>' : '') +
        (a.phone ? esc(a.phone) + '<br>' : '') + esc(a.email) + '</div>' +
      '<div class="inv"><h1>Invoice</h1><div class="invno"># ' + esc(a.nextInvoice) + '</div>' +
        '<table class="dates"><tr><td class="k">Invoice Date :</td><td class="v">' + esc(d.inv) + '</td></tr>' +
        '<tr><td class="k">Due Date :</td><td class="v">' + esc(d.due) + '</td></tr>' +
        '<tr><td class="k">Paid Date :</td><td class="v">' + esc(isoToMdyFull(paid)) + '</td></tr></table></div>' +
    '</div>' +
    '<div style="margin-top:12px;color:#555;font-style:italic">Partial Payment</div>' +
    '<table><thead><tr><th style="width:30px">No</th><th>Order Date</th><th>Delivery Date</th><th>Name &amp; Town</th><th>Qty</th><th>Unit price</th><th>Total price</th><th>Check #</th><th>Amount</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table>' +
    '<div class="sum"><div style="font-style:italic;color:#555">Thank you for business with us.</div>' +
    '<table><tr><td><b>Invoice Total</b></td><td style="text-align:right"><b>' + money(total) + '</b></td></tr>' +
    '<tr><td><b>Balance Due</b></td><td style="text-align:right"><b>' + money(balance) + '</b></td></tr></table></div>';
  $('outOverlay').classList.remove('hidden');
}

$('outTopBtn').onclick = openOutput;
$('outBtn').onclick = openOutput;
$('closeOutBtn').onclick = () => $('outOverlay').classList.add('hidden');
$('printBtn').onclick = () => window.print();

// ---------- boot ----------
(async function start() {
  try {
    accounts = (await api({ action: 'accounts' })).accounts;
    initApp();
  } catch (e) { showMsg(e.message, false); }
})();
</script>
</body>
