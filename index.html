<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인보이스 입력 - Glenview Florist</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1f2933; --muted: #6b7280; --line: #e3e6ea;
    --brand: #2f6f4f; --brand-dark: #245a40; --danger: #b42318; --warn-bg: #fff4d6; --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171a; --card: #1e2227; --text: #e8eaed; --muted: #9aa3ad; --line: #2e343b;
            --brand: #4caf7d; --brand-dark: #3d9468; --danger: #f97066; --warn-bg: #3a3017; --warn: #f4c95d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); font-size: 16px; }
  header { background: var(--brand); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header button { background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  main { max-width: 860px; margin: 0 auto; padding: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; background: var(--card); color: var(--text); }
  input:focus, select:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .btn { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 12px 16px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 14px; }
  .btn:hover { background: var(--brand-dark); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); margin-top: 8px; }
  .total-preview { text-align: right; font-weight: 600; margin-top: 10px; }
  .meta { color: var(--muted); font-size: 13px; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; display: none; }
  .msg.ok { display: block; background: #e6f4ea; color: #1e6b3a; }
  .msg.err { display: block; background: #fde8e6; color: var(--danger); }
  .warn { background: var(--warn-bg); color: var(--warn); padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.act { white-space: nowrap; text-align: right; }
  td.act button { background: none; border: 0; color: var(--brand); cursor: pointer; font-size: 13px; padding: 4px; }
  td.act button.del { color: var(--danger); }
  tfoot td { font-weight: 700; border-bottom: 0; }
  .tablewrap { overflow-x: auto; }
  #lock { max-width: 360px; margin: 80px auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="lock" class="card hidden">
  <h2>PIN 입력</h2>
  <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password">
  <button class="btn" id="pinBtn">확인</button>
  <div id="pinMsg" class="msg err" style="margin-top:10px"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>인보이스 입력</h1>
    <button id="logoutBtn">잠금</button>
  </header>
  <main>
    <div id="msg" class="msg"></div>

    <div class="card">
      <div class="row">
        <div>
          <label for="account">어카운트</label>
          <select id="account"></select>
        </div>
        <div>
          <label for="month">청구월 (배송일 기준)</label>
          <input id="month" type="month">
        </div>
      </div>
      <div class="meta" id="acctMeta" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2 id="formTitle">주문 입력</h2>
      <div class="row">
        <div>
          <label for="orderDate">Order Date</label>
          <input id="orderDate" type="date">
        </div>
        <div>
          <label for="deliveryDate">Delivery Date</label>
          <input id="deliveryDate" type="date">
        </div>
      </div>
      <label for="nameTown">Name &amp; Town</label>
      <input id="nameTown" type="text" placeholder="예: Eppie Bacalla, Skokie IL" autocomplete="off">
      <div class="row">
        <div>
          <label for="qty">Qty</label>
          <input id="qty" type="number" inputmode="numeric" min="1" step="1" value="1">
        </div>
        <div>
          <label for="unitPrice">Unit Price ($)</label>
          <input id="unitPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="total-preview">Total: <span id="totalPreview">$0.00</span></div>
      <button class="btn" id="saveBtn">추가</button>
      <button class="btn secondary hidden" id="cancelEditBtn">수정 취소</button>
    </div>

    <div class="card">
      <h2 id="listTitle">입력 내역</h2>
      <div id="unassignedBox"></div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>Order</th><th>Delivery</th><th>Name &amp; Town</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
          <tfoot><tr><td colspan="5">Invoice Total</td><td class="num" id="grandTotal">$0.00</td><td></td></tr></tfoot>
        </table>
      </div>
      <div class="meta" id="capacityMeta" style="margin-top:8px"></div>
    </div>
  </main>
</div>

<script>
// ====== 설정 ======
// Apps Script 웹앱 배포 후 받은 URL (…/exec) 을 아래에 붙여넣으세요.
const API_URL = 'https://script.google.com/macros/s/AKfycbzEQuHS30yoDyBrwAqYvNgqf4Wr6wlZbmiKGsyzaRfjZQBy2zF9kKlC3yv0LiOUPWwE/exec';
// ==================

const $ = (id) => document.getElementById(id);
let pin = localStorage.getItem('invoicePin') || '';
let accounts = [];
let editingRow = null;
let dirtyDelivery = false;

const money = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const monthStr = () => todayStr().slice(0, 7);

function showMsg(text, ok) {
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  if (ok) setTimeout(() => { if (el.textContent === text) el.className = 'msg'; }, 3500);
}

async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // avoids CORS preflight
    body: JSON.stringify(Object.assign({ pin: pin }, payload))
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '요청 실패');
  return data;
}

// ---------- PIN ----------
async function unlock(candidate) {
  pin = candidate;
  try {
    const data = await api({ action: 'accounts' });
    accounts = data.accounts;
    localStorage.setItem('invoicePin', pin);
    $('lock').classList.add('hidden');
    $('app').classList.remove('hidden');
    initApp();
  } catch (e) {
    pin = '';
    localStorage.removeItem('invoicePin');
    $('lock').classList.remove('hidden');
    $('app').classList.add('hidden');
    $('pinMsg').textContent = e.message;
    $('pinMsg').style.display = 'block';
  }
}

$('pinBtn').onclick = () => unlock($('pinInput').value.trim());
$('pinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pinBtn').click(); });
$('logoutBtn').onclick = () => { localStorage.removeItem('invoicePin'); location.reload(); };

// ---------- App ----------
function initApp() {
  const sel = $('account');
  const last = localStorage.getItem('invoiceAccount');
  sel.innerHTML = '';
  accounts.forEach((a) => {
    const o = document.createElement('option');
    o.value = a.key; o.textContent = a.name;
    sel.appendChild(o);
  });
  if (last && accounts.some((a) => a.key === last)) sel.value = last;
  $('month').value = monthStr();
  resetForm();
  refresh();
}

function currentAccount() { return accounts.find((a) => a.key === $('account').value); }

function resetForm() {
  editingRow = null; dirtyDelivery = false;
  $('formTitle').textContent = '주문 입력';
  $('saveBtn').textContent = '추가';
  $('cancelEditBtn').classList.add('hidden');
  $('orderDate').value = todayStr();
  $('deliveryDate').value = todayStr();
  $('nameTown').value = '';
  $('qty').value = 1;
  $('unitPrice').value = '';
  updatePreview();
}

function updatePreview() {
  const t = Number($('qty').value || 0) * Number($('unitPrice').value || 0);
  $('totalPreview').textContent = money(t);
}

['qty', 'unitPrice'].forEach((id) => $(id).addEventListener('input', updatePreview));
$('orderDate').addEventListener('change', () => { if (!dirtyDelivery) $('deliveryDate').value = $('orderDate').value; });
$('deliveryDate').addEventListener('change', () => { dirtyDelivery = true; });
$('account').addEventListener('change', () => { localStorage.setItem('invoiceAccount', $('account').value); resetForm(); refresh(); });
$('month').addEventListener('change', refresh);
$('cancelEditBtn').onclick = resetForm;

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

async function refresh() {
  const acct = currentAccount();
  if (!acct) return;
  $('acctMeta').textContent = (acct.attn ? 'Attn: ' + acct.attn + '  ·  ' : '') + '다음 인보이스 번호: ' + acct.nextInvoice;
  $('listTitle').textContent = '입력 내역 - ' + ($('month').value || '전체');
  try {
    const data = await api({ action: 'list', account: acct.key, month: $('month').value });
    renderRows(data);
  } catch (e) { showMsg(e.message, false); }
}

function renderRows(data) {
  const rows = data.rows.slice().sort((a, b) => (a.deliveryDate + a.row).localeCompare(b.deliveryDate + b.row));
  let total = 0;
  $('rows').innerHTML = rows.map((r) => {
    total += Number(r.total || 0);
    return '<tr>' +
      '<td>' + esc(r.orderDate.slice(5)) + '</td>' +
      '<td>' + esc(r.deliveryDate.slice(5)) + '</td>' +
      '<td>' + esc(r.nameTown) + '</td>' +
      '<td class="num">' + esc(r.qty) + '</td>' +
      '<td class="num">' + money(r.unitPrice) + '</td>' +
      '<td class="num">' + money(r.total) + '</td>' +
      '<td class="act"><button data-edit="' + r.row + '">수정</button><button class="del" data-del="' + r.row + '">삭제</button></td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="7" class="meta">이 달에 입력된 주문이 없습니다.</td></tr>';
  $('grandTotal').textContent = money(total);
  $('capacityMeta').textContent = '시트 사용량: ' + data.used + ' / ' + data.capacity + '행 (전체 월 합계)';

  $('unassignedBox').innerHTML = data.unassigned.length
    ? '<div class="warn">배송일이 없는 행이 ' + data.unassigned.length + '건 있습니다. 배송일이 있어야 청구월에 포함됩니다: ' +
      data.unassigned.map((r) => esc(r.nameTown || '(이름 없음)') + ' [행 ' + r.row + ']').join(', ') + '</div>'
    : '';

  const byRow = {};
  rows.forEach((r) => { byRow[r.row] = r; });
  document.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => startEdit(byRow[b.dataset.edit]));
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => removeRow(byRow[b.dataset.del]));
}

function startEdit(r) {
  editingRow = r.row; dirtyDelivery = true;
  $('formTitle').textContent = '수정 중 (행 ' + r.row + ')';
  $('saveBtn').textContent = '수정 저장';
  $('cancelEditBtn').classList.remove('hidden');
  $('orderDate').value = r.orderDate;
  $('deliveryDate').value = r.deliveryDate;
  $('nameTown').value = r.nameTown;
  $('qty').value = r.qty;
  $('unitPrice').value = r.unitPrice;
  updatePreview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function removeRow(r) {
  if (!confirm('삭제할까요?\n' + r.deliveryDate + '  ' + r.nameTown + '  ' + money(r.total))) return;
  try {
    await api({ action: 'delete', account: currentAccount().key, row: r.row });
    showMsg('삭제했습니다.', true);
    if (editingRow === r.row) resetForm();
    refresh();
  } catch (e) { showMsg(e.message, false); }
}

$('saveBtn').onclick = async () => {
  const btn = $('saveBtn');
  const payload = {
    action: editingRow ? 'update' : 'add',
    account: currentAccount().key,
    row: editingRow,
    orderDate: $('orderDate').value,
    deliveryDate: $('deliveryDate').value,
    nameTown: $('nameTown').value,
    qty: $('qty').value,
    unitPrice: $('unitPrice').value
  };
  btn.disabled = true;
  try {
    await api(payload);
    const wasEdit = !!editingRow;
    const keepOrder = $('orderDate').value, keepDelivery = $('deliveryDate').value;
    showMsg(wasEdit ? '수정했습니다.' : '추가했습니다.', true);
    // 배송일 기준 청구월로 목록 이동
    if (keepDelivery) $('month').value = keepDelivery.slice(0, 7);
    resetForm();
    if (!wasEdit) { $('orderDate').value = keepOrder; $('deliveryDate').value = keepDelivery; dirtyDelivery = true; }
    refresh();
    if (!wasEdit) $('nameTown').focus();
  } catch (e) { showMsg(e.message, false); }
  btn.disabled = false;
};

// ---------- boot ----------
if (API_URL.indexOf('PASTE_') === 0) {
  document.body.innerHTML = '<p style="padding:20px">index.html 상단의 API_URL에 Apps Script 웹앱 URL을 붙여넣어 주세요.</p>';
} else if (pin) {
  unlock(pin);
} else {
  $('lock').classList.remove('hidden');
}
</script>
</body>
</html>
